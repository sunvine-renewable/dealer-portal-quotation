<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Auto-Redirect browser visitors to official domain, while allowing installed PWA to auto-update natively without reinstalling -->
    <script>
      (function() {
        var isPWA = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
        var h = window.location.hostname;
        if (!isPWA && h && (h.indexOf('onrender.com') !== -1 || h.indexOf('render.com') !== -1)) {
          window.location.replace('https://sunvine-dealer.vprotech.online' + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1B2E" />
    <meta name="description" content="Sunvine Renewable Energy - Solar EPC Dealer & Admin Quotation Portal" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sunvine EPC" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    <title>Sunvine Solar EPC Portal</title>
    <style>
      /* Critical baseline styling to guarantee zero raw HTML or FOUC */
      html, body {
        background-color: #F7F9FF;
        color: #181C20;
        margin: 0;
        padding: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        background-color: #F7F9FF;
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        font-feature-settings: 'liga';
        text-rendering: optimizeLegibility;
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            if (reg) {
              reg.update().catch(() => {});
              reg.addEventListener('updatefound', () => {
                var newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      window.location.reload();
                    }
                  });
                }
              });
            }
          }).catch(() => {});
        });
      }
    </script>
  </head>
  <body class="bg-[#F7F9FF] text-[#181C20] font-sans antialiased selection:bg-[#6CBF3D] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
